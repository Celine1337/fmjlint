name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fmjlint.py \
            --title "fmjlint $GITHUB_REF_NAME" \
            --notes "Single-file Fabric fabric.mod.json validator. Run with Python 3.9+: python fmjlint.py fabric.mod.json"